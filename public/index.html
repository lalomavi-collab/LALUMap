<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LALUM</title>
  <meta name="description" content="LALUM Legal Engine — ניהול משרד, ביקורת סיכון AI ומרכז ידע נדל&quot;ן">

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#F7F6F1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LALUM">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <h1 class="display" id="screen-title">לקוחות</h1>
      <div class="avatar" aria-hidden="true"></div>
    </header>

    <!-- ניהול משרד — מחובר ל-lalum_contacts האמיתית, קריאה מוגבלת ל-admin ע"י RLS -->
    <main class="screen active" id="screen-practice" aria-labelledby="screen-title">
      <button class="btn-primary" type="button" disabled title="יצירת לקוח עדיין לא מחוברת">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        לקוח חדש
      </button>

      <div class="section-label">לקוחות (נתונים אמיתיים)</div>
      <div id="clients-auth-gate"></div>
      <div id="clients-list"></div>
    </main>

    <!-- ביקורת AI -->
    <main class="screen" id="screen-risk" aria-labelledby="screen-title">
      <!-- Mode switcher: the four practice pillars share this one audit view
           instead of each getting its own screen. Still sample/static data
           (see README — this screen has no schema behind it yet); the
           switcher itself and the tone system (ok/warn/high, matching the
           risk-badge language already live on lalumapp.com) are real. -->
      <div class="tabs" id="risk-tabs" role="tablist" aria-label="תחום ביקורת"></div>
      <div id="risk-content"></div>
    </main>

    <!-- מרכז ידע -->
    <main class="screen" id="screen-knowledge" aria-labelledby="screen-title">
      <div class="search-bar">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <span>חיפוש נושא, סעיף, פסק דין</span>
      </div>

      <div class="tabs">
        <button class="tab" type="button">קורסים</button>
        <button class="tab" type="button">מדריכים</button>
        <button class="tab active" type="button">פסיקה</button>
      </div>

      <!-- Domain filter: same four practice pillars as ביקורת AI, so the
           same mental model ("pick your area") carries across screens.
           Still sample cards (2 per domain) — only the filter is real. -->
      <div class="tabs" id="knowledge-domains" role="tablist" aria-label="תחום"></div>
      <div id="knowledge-cards"></div>

      <!-- ניוזלטר יומי — הרשמה אמיתית, מחוברת ל-lalum-newsletter-subscribe.
           עדכון קצר אחד ביום, בהסכמה מפורשת (תיקון 13 לחוק הגנת הפרטיות). -->
      <div id="newsletter-card"></div>
    </main>

    <!-- קהילה — מחובר ל-lalum_group_chat_messages, קריאה/כתיבה לכל משתמש מחובר -->
    <main class="screen" id="screen-community" aria-labelledby="screen-title">
      <div id="community-auth-gate"></div>
      <form id="community-composer" class="card" style="flex-direction:row; gap:8px; align-items:center; display:none;">
        <input type="text" id="community-input" placeholder="שתפו את הקהילה..." autocomplete="off"
          style="flex:1; background:none; border:none; color:var(--text); font-family:inherit; font-size:14px; outline:none;">
        <button type="submit" class="btn-primary" style="width:auto; height:40px; padding:0 18px;">שליחה</button>
      </form>
      <div id="community-list"></div>
    </main>

    <nav class="bottom-nav" aria-label="ניווט ראשי">
      <button class="nav-item active" type="button" data-screen="practice" data-title="לקוחות">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.4"/><path d="M2.5 20c1-4 3.4-6 6.5-6s5.5 2 6.5 6"/><circle cx="17.5" cy="9" r="2.6"/><path d="M15.5 13.2c2.4.3 4 2 4.8 4.8"/></svg>
        <span>לקוחות</span>
      </button>
      <button class="nav-item" type="button" data-screen="risk" data-title="ביקורת AI">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 3v18M4 8h5M4 16h5"/><circle cx="16.5" cy="12" r="5.2"/></svg>
        <span>ביקורת AI</span>
      </button>
      <button class="nav-item" type="button" data-screen="knowledge" data-title="מרכז ידע">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5c3-1.5 6-1.5 8 0v14c-2-1.5-5-1.5-8 0V5zM20 5c-3-1.5-6-1.5-8 0v14c2-1.5 5-1.5 8 0V5z"/></svg>
        <span>מרכז ידע</span>
      </button>
      <button class="nav-item" type="button" data-screen="community" data-title="קהילה">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="9" r="3"/><circle cx="16" cy="9" r="3"/><path d="M2.5 20c.8-3.6 3-5.5 5.5-5.5s4.7 1.9 5.5 5.5M10.5 14.7c.8-2.6 2.8-4 5.5-4s4.9 1.6 5.5 4.3"/></svg>
        <span>קהילה</span>
      </button>
    </nav>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="/config.js"></script>
  <script src="/app.js"></script>
  <script src="/data.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
